<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>游戏管理 · 像素游乐场</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--text:#edf2ff;--muted:#99a7c2;--accent:#8b7cff;--border:#ffffff22}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 15% 0%,#29204d 0,transparent 35%),var(--bg);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button,a{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #b9b0ff;outline-offset:3px}.wrap{width:min(780px,calc(100% - 28px));margin:24px auto}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.head a{color:#c8c0ff}.panel{padding:24px;background:#141c31;border:1px solid var(--border);border-radius:20px}.panel h1{margin:0 0 8px;font-size:28px}.muted{color:var(--muted);line-height:1.7;font-size:14px}.warning{padding:13px 15px;border-radius:12px;background:#79541b33;border:1px solid #ffd16655;color:#ffe1a0;font-size:13px;line-height:1.7;margin:16px 0}.form{display:grid;gap:15px;margin-top:18px}.form label{display:grid;gap:7px;font-size:14px}.form input,.form textarea,.form select{width:100%;padding:11px 12px;color:var(--text);background:#0b1222;border:1px solid var(--border);border-radius:10px}.form textarea{resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.button{padding:11px 16px;color:white;background:#263451;border:1px solid var(--border);border-radius:10px}.primary{background:var(--accent);border-color:transparent;font-weight:700}.button:disabled{opacity:.55;cursor:wait}.preview{max-width:100%;max-height:220px;object-fit:contain;border-radius:12px}.status{min-height:24px;color:#bdebd7;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.progress{height:8px;background:#ffffff15;border-radius:9px;overflow:hidden}.progress span{display:block;width:0;height:100%;background:#8b7cff;transition:width .2s}.hint{font-size:12px;color:#aab7d0}.required{color:#ffb6c1}.mode{padding:12px 14px;background:#ffffff08;border:1px solid var(--border);border-radius:12px}.mode label{display:flex;align-items:center;gap:9px}.mode input{width:auto}.mode select{margin-top:10px}.hidden{display:none!important}code{color:#d6ceff}@media(max-width:560px){.wrap{margin:14px auto}.panel{padding:18px}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="head"><a href="./">← 返回游戏盒</a><span>游戏管理入口</span></div>
    <section class="panel">
      <h1>上传 / 更新游戏</h1>
      <p class="muted">新增游戏会自动加入首页；选择已有游戏可更新 HTML、名称、分类、介绍和封面。上传完成后，等待 Pages 发布并刷新首页即可。</p>
      <div class="warning"><strong>安全提醒：</strong>此静态页面不会保存 Token。请使用只针对 <code>godblees/game_home</code> 的 Fine-grained Token，并仅授予 <strong>Contents: Read and write</strong>。不要分享 Token；完成后关闭此页面。</div>
      <form id="form" class="form">
        <label>GitHub Fine-grained Token <span class="required">*</span><input id="token" type="password" autocomplete="off" required placeholder="粘贴仅对此仓库授权的 Token"><span class="hint">GitHub → Settings → Developer settings → Fine-grained tokens；仓库权限 Contents 设为 Read and write。</span></label>
        <div class="mode">
          <label><input id="updateMode" type="checkbox"> 更新已有游戏</label>
          <select id="existingGame" class="hidden" aria-label="选择要更新的游戏"><option value="">先加载游戏列表</option></select>
          <p id="modeHint" class="hint">默认模式为新增游戏。</p>
        </div>
        <div class="row">
          <label>游戏名称 <span class="required">*</span><input id="title" maxlength="50" required placeholder="例如：我的冒险游戏"></label>
          <label>游戏分类<select id="category"><option>休闲</option><option>益智</option><option>街机</option><option>动作</option><option>其他</option></select></label>
        </div>
        <label>游戏介绍<textarea id="description" rows="3" maxlength="240" placeholder="介绍玩法和操作方式"></textarea></label>
        <label>游戏 HTML 文件 <span id="gameRequired" class="required">*</span><input id="gameFile" type="file" accept=".html,.htm,text/html"><span id="gameHint" class="hint">新增时必选，单文件 HTML 最大 10 MB（CSS/JavaScript 请内嵌）。更新时不选文件则保留当前游戏文件。</span></label>
        <label>游戏封面（PNG、JPG、WebP，最大 5 MB，可选）<input id="coverFile" type="file" accept="image/png,image/jpeg,image/webp"><span id="coverHint" class="hint">更新时不选择新封面会保留已有封面。</span><img id="preview" class="preview" alt="封面预览" hidden></label>
        <div class="progress" aria-hidden="true"><span id="progress"></span></div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <button id="submit" class="button primary" type="submit">上传并添加到游戏列表</button>
      </form>
    </section>
  </main>
  <script>
    'use strict';
    const OWNER='godblees', REPO='game_home', BRANCH='main', API='https://api.github.com';
    const $=id=>document.getElementById(id);
    let catalog={version:1,games:[]},catalogSha='',previewUrl=null;
    function setStatus(text,isError=false){$('status').textContent=text;$('status').style.color=isError?'#ffb6c1':'#bdebd7'}
    function setProgress(value){$('progress').style.width=Math.max(0,Math.min(100,value))+'%'}
    function slugify(text){return text.normalize('NFKD').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'game'}
    function toBase64(bytes){let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(binary)}
    function extFor(file){return {'image/png':'png','image/jpeg':'jpg','image/webp':'webp'}[file.type]||''}
    async function api(path,token,options={}){
      const response=await fetch(`${API}/repos/${OWNER}/${REPO}/contents/${path}`,{...options,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json',...(options.headers||{})}});
      const data=await response.json().catch(()=>({}));if(!response.ok){const error=new Error(data.message||`GitHub API 返回 ${response.status}`);error.status=response.status;throw error}return data;
    }
    async function refreshCatalog(token){
      const file=await api(`games.json?ref=${BRANCH}`,token);
      const binary=atob((file.content||'').replace(/\s/g,''));
      const bytes=Uint8Array.from(binary,ch=>ch.charCodeAt(0));
      catalog=JSON.parse(new TextDecoder().decode(bytes));
      if(!catalog||!Array.isArray(catalog.games))throw new Error('games.json 格式无效');
      catalogSha=file.sha;
      const select=$('existingGame');select.replaceChildren(new Option('请选择要更新的游戏',''));
      catalog.games.forEach(game=>select.add(new Option(`${game.title}（${game.category||'未分类'}）`,game.id)));
      if(!catalog.games.length)select.replaceChildren(new Option('当前没有已上传的游戏',''));
    }
    async function putFile(path,bytes,message,token){
      let sha;try{sha=(await api(`${path}?ref=${BRANCH}`,token)).sha}catch(error){if(error.status!==404)throw error}
      const body={message,content:toBase64(bytes),branch:BRANCH};if(sha)body.sha=sha;
      return api(path,token,{method:'PUT',body:JSON.stringify(body)});
    }
    $('token').addEventListener('change',async()=>{
      const token=$('token').value.trim();if(!token)return;
      try{setStatus('正在读取已上传游戏列表……');await refreshCatalog(token);setStatus(`已读取 ${catalog.games.length} 款已上传游戏。`)}catch(error){setStatus('读取游戏列表失败：'+error.message+'。请检查 Token 权限。',true)}
    });
    $('updateMode').addEventListener('change',()=>{
      const update=$('updateMode').checked;$('existingGame').classList.toggle('hidden',!update);$('gameRequired').classList.toggle('hidden',update);$('gameFile').required=!update;
      $('submit').textContent=update?'保存游戏更新':'上传并添加到游戏列表';$('modeHint').textContent=update?'选择已有游戏；HTML 文件可不选，不选则保留原文件。封面也可不选以保留原封面。':'默认模式为新增游戏。';
    });
    $('existingGame').addEventListener('change',()=>{
      const game=catalog.games.find(item=>item.id===$('existingGame').value);if(!game)return;
      $('title').value=game.title||'';$('description').value=game.description||'';
      const options=[...$('category').options];const match=options.find(option=>option.value===game.category||option.textContent===game.category);if(match)$('category').value=match.value;
      $('coverHint').textContent=game.cover?'当前封面会保留；选择新图片即可替换。':'此游戏没有封面，可选择图片添加。';
    });
    $('coverFile').addEventListener('change',()=>{
      if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null;$('preview').hidden=true;$('preview').removeAttribute('src');
      const file=$('coverFile').files[0];if(!file)return;
      if(!extFor(file)||file.size>5*1024*1024){setStatus('封面需为 PNG、JPG 或 WebP，且不超过 5 MB。',true);$('coverFile').value='';return}
      previewUrl=URL.createObjectURL(file);$('preview').src=previewUrl;$('preview').hidden=false;setStatus('');
    });
    $('gameFile').addEventListener('change',()=>{const file=$('gameFile').files[0];if(file&&!$('title').value.trim())$('title').value=file.name.replace(/\.html?$/i,'').slice(0,50)});

    $('form').addEventListener('submit',async event=>{
      event.preventDefault();const token=$('token').value.trim(),title=$('title').value.trim(),gameFile=$('gameFile').files[0],coverFile=$('coverFile').files[0],updating=$('updateMode').checked;
      const selected=updating?catalog.games.find(game=>game.id===$('existingGame').value):null;
      if(!token||!title){setStatus('请填写 Token 和游戏名称。',true);return}
      if(updating&&!selected){setStatus('请先选择需要更新的游戏。',true);return}
      if(!updating&&!gameFile){setStatus('新增游戏必须选择 HTML 文件。',true);return}
      if(gameFile&&(!/\.html?$/i.test(gameFile.name)||!gameFile.size||gameFile.size>10*1024*1024)){setStatus('请选择有效的 HTML 文件（非空，最大 10 MB）。',true);return}
      if(coverFile&&(!extFor(coverFile)||coverFile.size>5*1024*1024)){setStatus('封面需为 PNG、JPG 或 WebP，且不超过 5 MB。',true);return}
      const submit=$('submit');submit.disabled=true;
      try{
        setProgress(5);
        let game=selected;
        if(!game){const id=slugify(title)+'-'+Date.now().toString(36);game={id,title,category:$('category').value,description:'',emoji:'🎮',color:'linear-gradient(135deg,#3862a8,#30204d)',url:`./games/${id}/index.html`};catalog.games.unshift(game)}
        game.title=title;game.category=$('category').value;game.description=$('description').value.trim()||'新上传的网页小游戏。';game.emoji=game.emoji||'🎮';game.color=game.color||'linear-gradient(135deg,#3862a8,#30204d)';
        if(gameFile){setStatus(updating?'正在更新游戏 HTML……':'正在上传游戏 HTML……');const path=game.url?new URL(game.url,location.href).pathname.replace(/^\/game_home\//,''): `games/${game.id}/index.html`;await putFile(path,new Uint8Array(await gameFile.arrayBuffer()),`${updating?'Update':'Add'} game: ${title}`,token)}
        setProgress(38);
        if(coverFile){setStatus('正在上传游戏封面……');let coverPath=game.cover?new URL(game.cover,location.href).pathname.replace(/^\/game_home\//,''):'';if(!coverPath)coverPath=`assets/covers/${game.id}.${extFor(coverFile)}`;else coverPath=coverPath.replace(/\.(png|jpe?g|webp)$/i,'.'+extFor(coverFile));await putFile(coverPath,new Uint8Array(await coverFile.arrayBuffer()),`${updating?'Update':'Add'} cover: ${title}`,token);game.cover='./'+coverPath}
        setProgress(72);setStatus('正在保存游戏列表……');
        const latest=await api(`games.json?ref=${BRANCH}`,token);const binary=atob((latest.content||'').replace(/\s/g,''));const latestCatalog=JSON.parse(new TextDecoder().decode(Uint8Array.from(binary,ch=>ch.charCodeAt(0))));
        if(updating){const index=latestCatalog.games.findIndex(item=>item.id===selected.id);if(index<0)throw new Error('此游戏已从目录中移除，请刷新后重试。');latestCatalog.games[index]={...latestCatalog.games[index],...game}}
        else if(!latestCatalog.games.some(item=>item.id===game.id))latestCatalog.games.unshift(game);
        const content=toBase64(new TextEncoder().encode(JSON.stringify(latestCatalog,null,2)+'\n'));
        await api('games.json',token,{method:'PUT',body:JSON.stringify({message:`${updating?'Update':'Add'} game catalog: ${title}`,content,branch:BRANCH,sha:latest.sha})});
        catalog=latestCatalog;setProgress(100);setStatus(`${updating?'更新':'上传'}成功！${title} 已保存到仓库。等 GitHub Pages 发布后刷新首页即可看到。\n`+(gameFile?`游戏文件：${game.url}\n`:'保留了原游戏文件。\n')+(coverFile?`封面：${game.cover}`:'封面未更改。'));
        $('gameFile').value='';$('coverFile').value='';$('preview').hidden=true;if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null;await refreshCatalog(token);
      }catch(error){console.error(error);setStatus('操作失败：'+error.message+'\n请检查 Token 的 Contents: Read and write 权限；如果提示冲突，重新读取目录后重试。',true)}finally{submit.disabled=false}
    });
    window.addEventListener('pagehide',()=>{$('token').value='';if(previewUrl)URL.revokeObjectURL(previewUrl)});
  </script>
</body>
</html>
