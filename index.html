    "use strict";

    const clickGame = `<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at top,#312752,#0b1020 75%);font-family:system-ui,sans-serif;text-align:center}main{width:min(100%,470px);padding:22px}.stats{display:flex;justify-content:center;gap:32px;margin:22px}.stats b{display:block;color:#b7a6ff;font-size:38px}p{color:#b9b5cf;line-height:1.6}button{font:inherit;cursor:pointer}#target{width:170px;height:170px;color:white;background:linear-gradient(135deg,#a68bff,#6852e7);border:0;border-radius:50%;box-shadow:0 12px 50px #8b7cff55;font-size:25px;font-weight:bold;touch-action:manipulation}#target:active{transform:scale(.96)}#target:disabled{opacity:.55}#start{display:block;margin:20px auto;padding:11px 23px;color:white;background:#ffffff15;border:1px solid #ffffff35;border-radius:10px}.hint{min-height:25px}</style><main><h1>⚡ 极速点击</h1><p>在 10 秒内尽可能多地点击按钮！</p><div class="stats"><span><b id="score">0</b>点击次数</span><span><b id="time">10.0</b>剩余秒数</span></div><button id="target" disabled>点我！</button><button id="start">开始挑战</button><p id="hint" class="hint" aria-live="polite">准备好了吗？</p></main><script>
const target=document.getElementById('target'),start=document.getElementById('start'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),hint=document.getElementById('hint');let score=0,endAt=0,timer=null,running=false,best=0;
function finish(){if(!running)return;running=false;clearInterval(timer);timer=null;target.disabled=true;start.disabled=false;start.textContent='再挑战一次';timeEl.textContent='0.0';if(score>best)best=score;hint.textContent='挑战完成：'+score+' 次，最佳 '+best+' 次。'}
start.onclick=()=>{clearInterval(timer);score=0;running=true;scoreEl.textContent='0';timeEl.textContent='10.0';hint.textContent='加油，冲击更高分！';target.disabled=false;start.disabled=true;endAt=performance.now()+10000;timer=setInterval(()=>{let left=Math.max(0,endAt-performance.now());timeEl.textContent=(left/1000).toFixed(1);if(left===0)finish()},25)};

<\/script></html>`;

    const snakeGame = `<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:white;background:radial-gradient(circle at top,#17392f,#0b1020 75%);font-family:system-ui,sans-serif;text-align:center}main{width:min(100%,470px);padding:14px}h1{margin:4px}.hud{display:flex;justify-content:center;gap:25px;margin:10px}.hud b{display:block;color:#92efc7;font-size:26px}canvas{display:block;width:min(78vw,360px);height:auto;margin:auto;background:#0f1e1a;border:2px solid #3b6c5e;border-radius:12px;touch-action:none}.row{display:flex;justify-content:center;gap:8px;margin:10px}.btn,.pad button{padding:9px 13px;color:white;background:#ffffff15;border:1px solid #ffffff30;border-radius:9px;font:inherit}.pad{display:grid;grid-template-columns:repeat(3,48px);gap:5px;justify-content:center}.pad button{padding:8px}.hint{color:#cfeadf;font-size:13px}</style><main><h1>🐍 贪吃蛇</h1><div class="hud"><span><b id="score">0</b>分数</span><span><b id="best">0</b>本局最佳</span></div><canvas id="board" width="360" height="360" aria-label="贪吃蛇棋盘"></canvas><div class="row"><button id="toggle" class="btn">开始游戏</button><button id="reset" class="btn">重新开始</button></div><div class="pad"><span></span><button data-dir="up">▲</button><span></span><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><p class="hint">方向键 / WASD 或触屏按钮控制；空格暂停。</p></main><script>
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),N=18,C=20,scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),toggle=document.getElementById('toggle');let snake,dir,next,food,score,best=0,timer=null,paused=true,over=false;
function placeFood(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function draw(){ctx.fillStyle='#0f1e1a';ctx.fillRect(0,0,360,360);ctx.strokeStyle='#18352d';for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,360);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*C);ctx.lineTo(360,i*C);ctx.stroke()}ctx.fillStyle='#ffbd59';ctx.beginPath();ctx.arc(food.x*C+10,food.y*C+10,7,0,Math.PI*2);ctx.fill();snake.forEach((p,i)=>{ctx.fillStyle=i?'#45c997':'#a1ffd6';ctx.fillRect(p.x*C+2,p.y*C+2,16,16)});if(over){ctx.fillStyle='#0009';ctx.fillRect(0,0,360,360);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 23px system-ui';ctx.fillText('游戏结束 · '+score+' 分',180,177)}}
function reset(){clearInterval(timer);timer=null;snake=[{x:8,y:9},{x:7,y:9},{x:6,y:9}];dir={x:1,y:0};next={x:1,y:0};score=0;over=false;paused=true;scoreEl.textContent='0';toggle.textContent='开始游戏';placeFood();draw()}
function start(){if(over)reset();if(timer){paused=!paused;toggle.textContent=paused?'继续':'暂停';return}paused=false;toggle.textContent='暂停';timer=setInterval(tick,125)}
function tick(){if(paused)return;dir=next;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y},eat=head.x===food.x&&head.y===food.y,body=eat?snake:snake.slice(0,-1);if(head.x<0||head.y<0||head.x>=N||head.y>=N||body.some(p=>p.x===head.x&&p.y===head.y)){clearInterval(timer);timer=null;over=true;paused=true;toggle.textContent='再来一局';draw();return}snake.unshift(head);if(eat){score+=10;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best}placeFood()}else snake.pop();draw()}
const dirs={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},ArrowDown:{x:0,y:1},s:{x:0,y:1},ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},ArrowRight:{x:1,y:0},d:{x:1,y:0}};document.addEventListener('keydown',e=>{const d=dirs[e.key];if(d){e.preventDefault();if(d.x!==-dir.x||d.y!==-dir.y)next=d}else if(e.code==='Space'){e.preventDefault();start()}});document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[b.dataset.dir];if(d.x!==-dir.x||d.y!==-dir.y)next=d});toggle.onclick=start;document.getElementById('reset').onclick=reset;reset();
<\/script></html>`;

    const game2048 = `<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#403667,#0b1020 75%);color:#fff;font-family:system-ui,sans-serif;text-align:center}main{width:min(100%,460px);padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.scores{display:flex;gap:7px}.score{background:#ffffff20;border-radius:8px;padding:5px 10px;color:#ddd}.score b{display:block;font-size:20px}.buttons{display:flex;gap:8px;margin:10px 0}.buttons button{flex:1}.btn{padding:9px;color:white;background:#7669df;border:0;border-radius:8px;font:inherit}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:9px;background:#ffffff20;border-radius:12px;touch-action:none}.cell{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;background:#ffffff12;font-size:clamp(22px,7vw,37px);font-weight:800;color:#26304a}.v0{color:transparent}.v2{background:#eee8db}.v4{background:#ebd9b6}.v8{background:#f3ad6d;color:white}.v16{background:#f28b5b;color:white}.v32{background:#f06e55;color:white}.v64{background:#ed513d;color:white}.v128,.v256,.v512{background:#edcf63;color:white;font-size:clamp(18px,5vw,28px)}.v1024,.v2048{background:#e5bf32;color:white;font-size:clamp(16px,4.5vw,24px)}.hint{color:#d9dbe8;font-size:13px;min-height:20px}button{cursor:pointer}</style><main><div class="top"><h1>🔢 2048</h1><div class="scores"><div class="score">分数<b id="score">0</b></div><div class="score">本局最佳<b id="best">0</b></div></div></div><div class="buttons"><button id="new" class="btn">新游戏</button><button id="undo" class="btn">↶ 撤销一步</button></div><div id="board" class="board" aria-label="2048游戏棋盘"></div><p id="message" class="hint">方向键 / WASD 或滑动屏幕，合并数字到达 2048！</p></main><script>
const el=document.getElementById('board'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),message=document.getElementById('message');let grid,score=0,best=0,previous=null;
function spawn(){const empty=[];grid.forEach((r,y)=>r.forEach((v,x)=>{if(!v)empty.push([y,x])}));if(!empty.length)return;const [y,x]=empty[Math.floor(Math.random()*empty.length)];grid[y][x]=Math.random()<.9?2:4}
function render(){el.replaceChildren();grid.flat().forEach(v=>{const d=document.createElement('div');d.className='cell v'+Math.min(v,2048);d.textContent=v||'';el.appendChild(d)});scoreEl.textContent=score;bestEl.textContent=best}
function init(){grid=Array.from({length:4},()=>[0,0,0,0]);score=0;previous=null;spawn();spawn();message.textContent='方向键 / WASD 或滑动屏幕，合并数字到达 2048！';render()}
function hasMoves(){if(grid.some(r=>r.includes(0)))return true;for(let y=0;y<4;y++)for(let x=0;x<4;x++)if((x<3&&grid[y][x]===grid[y][x+1])||(y<3&&grid[y][x]===grid[y+1][x]))return true;return false}
function move(dir){const before=grid.map(r=>r.slice()),oldScore=score;function compress(line){let a=line.filter(Boolean),out=[];for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){out.push(a[i]*2);score+=a[i]*2;i++}else out.push(a[i])}while(out.length<4)out.push(0);return out}
if(dir==='left'||dir==='right'){for(let y=0;y<4;y++){let line=grid[y].slice();if(dir==='right')line.reverse();line=compress(line);if(dir==='right')line.reverse();grid[y]=line}}else{for(let x=0;x<4;x++){let line=grid.map(r=>r[x]);if(dir==='down')line.reverse();line=compress(line);if(dir==='down')line.reverse();for(let y=0;y<4;y++)grid[y][x]=line[y]}}
if(JSON.stringify(before)===JSON.stringify(grid)){score=oldScore;return}previous={grid:before,score:oldScore};spawn();if(score>best)best=score;render();if(grid.flat().includes(2048))message.textContent='🎉 2048 达成！还可以继续挑战更高分。';else if(!hasMoves())message.textContent='棋盘已满，没有可合并的方块。点击新游戏重新开始。'}
function undo(){if(!previous)return;grid=previous.grid;score=previous.score;previous=null;message.textContent='已撤销上一步。';render()}
document.addEventListener('keydown',e=>{const map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'};if(map[e.key]){e.preventDefault();move(map[e.key])}});let sx=null,sy=null;el.addEventListener('touchstart',e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:true});el.addEventListener('touchend',e=>{if(sx===null)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>24)move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));sx=sy=null},{passive:true});document.getElementById('new').onclick=init;document.getElementById('undo').onclick=undo;init();
<\/script></html>`;

    const memoryGame = `<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#2d2a5d,#0b1020 75%);color:white;font-family:system-ui,sans-serif;text-align:center}main{width:min(100%,520px);padding:15px}h1{margin:0}.stats{display:flex;justify-content:center;gap:20px;margin:12px;color:#ddd6ff}.stats b{display:block;font-size:24px;color:#c4b6ff}.levels{display:flex;justify-content:center;gap:7px;margin:10px}.levels button,.reset{padding:8px 12px;color:white;background:#ffffff12;border:1px solid #ffffff30;border-radius:9px;font:inherit}.levels .selected{background:#7568da}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.card{height:clamp(58px,16vw,88px);color:white;background:linear-gradient(135deg,#7c6dec,#4f76ff);border:0;border-radius:13px;font-size:clamp(25px,7vw,38px)}.card.open,.card.done{color:#202344;background:linear-gradient(135deg,#e5e9ff,#bbcaff)}.card.done{opacity:.55}.card:disabled{cursor:default}.reset{margin:12px}.hint{min-height:18px;color:#c1c4d9;font-size:13px}</style><main><h1>🧠 记忆翻牌</h1><div class="stats"><span><b id="moves">0</b>步数</span><span><b id="time">0</b>秒</span><span><b id="pairs">0/8</b>配对</span></div><div class="levels"><button data-level="6">轻松</button><button class="selected" data-level="8">标准</button><button data-level="10">挑战</button></div><div id="board" class="board"></div><button id="reset" class="reset">重新洗牌</button><p id="hint" class="hint">翻开两张牌，找到所有相同图案。</p></main><script>
const icons=['🍉','🍋','🍒','🍇','🍊','🍎','🍓','🥝','🍍','🥑'],board=document.getElementById('board');let level=8,opened=[],moves=0,matched=0,seconds=0,timer=null,locked=false,started=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setup(){clearInterval(timer);timer=null;opened=[];moves=0;matched=0;seconds=0;locked=false;started=false;document.getElementById('moves').textContent='0';document.getElementById('time').textContent='0';document.getElementById('pairs').textContent='0/'+level;document.getElementById('hint').textContent='翻开两张牌，找到所有相同图案。';board.style.gridTemplateColumns=level===10?'repeat(5,minmax(0,1fr))':'repeat(4,minmax(0,1fr))';board.replaceChildren();shuffle(icons.slice(0,level).concat(icons.slice(0,level))).forEach(icon=>{const b=document.createElement('button');b.className='card';b.textContent='?';b.setAttribute('aria-label','隐藏卡片');b.onclick=()=>flip(b,icon);board.appendChild(b)})}
function flip(button,icon){if(locked||button.classList.contains('open')||button.classList.contains('done'))return;if(!started){started=true;timer=setInterval(()=>{seconds++;document.getElementById('time').textContent=seconds},1000)}button.classList.add('open');button.textContent=icon;opened.push({button,icon});if(opened.length<2)return;moves++;document.getElementById('moves').textContent=moves;const [a,b]=opened;if(a.icon===b.icon){a.button.classList.add('done');b.button.classList.add('done');a.button.disabled=b.button.disabled=true;matched++;document.getElementById('pairs').textContent=matched+'/'+level;opened=[];if(matched===level){clearInterval(timer);document.getElementById('hint').textContent='🎉 配对成功！用时 '+seconds+' 秒，共 '+moves+' 步。'}}else{locked=true;setTimeout(()=>{for(const item of opened){item.button.classList.remove('open');item.button.textContent='?'}opened=[];locked=false},700)}}
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=Number(b.dataset.level);document.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('selected',x===b));setup()});document.getElementById('reset').onclick=setup;setup();
<\/script></html>`;

    const typingGame = `<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:white;background:linear-gradient(180deg,#1a2949,#0b1020 75%);font-family:system-ui,sans-serif;text-align:center}main{width:min(100%,540px);padding:18px}.hud{display:flex;justify-content:center;gap:22px;margin:12px}.hud b{display:block;font-size:27px;color:#b8c9ff}.panel{padding:18px;background:#ffffff0c;border:1px solid #ffffff20;border-radius:16px}.word{font-size:clamp(30px,8vw,52px);letter-spacing:2px;margin:12px}.word .good{color:#6ee7b7}.word .bad{color:#ff8585;text-decoration:underline}input{width:min(100%,360px);padding:13px;color:white;background:#0d1530;border:1px solid #8aa0ff77;border-radius:10px;font-size:20px;text-align:center}.row{display:flex;justify-content:center;gap:8px;margin:12px}.row button{padding:9px 16px;color:white;background:#ffffff18;border:1px solid #ffffff30;border-radius:9px;font:inherit}.status{min-height:24px;color:#dfe5ff}.hint{color:#a8b7d9;font-size:13px}</style><main><h1>⌨️ 打字挑战</h1><div class="hud"><span><b id="score">0</b>得分</span><span><b id="time">30</b>秒</span><span><b id="combo">0</b>连击</span></div><section class="panel"><div id="word" class="word">准备开始</div><input id="input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="点击开始后输入单词" aria-label="输入单词" disabled><div class="row"><button id="start">开始挑战</button><button id="reset">重置</button></div><div id="status" class="status">30 秒内尽可能准确地输入单词。</div></section><p class="hint">每 5 次连续答对会获得额外分数。</p></main><script>
const words=['pixel','game','snake','rocket','puzzle','happy','focus','button','music','dream','planet','maple','forest','swift','score','combo','magic','castle','jump','purple','garden','summer','window','silver','orange','rabbit','camera','dragon','piano','flower','coffee','friend','future','yellow','little','bridge','winter','cookie','shadow','thunder'],wordEl=document.getElementById('word'),input=document.getElementById('input'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),comboEl=document.getElementById('combo'),statusEl=document.getElementById('status');let score=0,time=30,combo=0,target='',timer=null,running=false,last='';
function showWord(){const val=input.value.toLowerCase();wordEl.replaceChildren();for(let i=0;i<target.length;i++){const span=document.createElement('span');span.textContent=target[i];if(i<val.length)span.className=val[i]===target[i]?'good':'bad';wordEl.appendChild(span)}}
function nextWord(){let options=words.filter(w=>w!==last);target=options[Math.floor(Math.random()*options.length)];last=target;showWord()}
function finish(){clearInterval(timer);timer=null;running=false;input.disabled=true;document.getElementById('start').disabled=false;document.getElementById('start').textContent='再来一次';statusEl.textContent='时间到！得分 '+score+'，连击 '+combo+'。'}
function start(){clearInterval(timer);score=0;time=30;combo=0;running=true;last='';scoreEl.textContent='0';timeEl.textContent='30';comboEl.textContent='0';input.disabled=false;input.value='';statusEl.textContent='开始冲刺！';document.getElementById('start').disabled=true;document.getElementById('start').textContent='挑战中…';nextWord();input.focus();timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)finish()},1000)}
input.addEventListener('input',()=>{if(!running)return;showWord();if(input.value.trim().toLowerCase()===target){combo++;score+=combo%5===0?3:1;scoreEl.textContent=score;comboEl.textContent=combo;statusEl.textContent=combo%5===0?'连击奖励！继续保持':'正确！继续冲刺';input.value='';nextWord()}});document.getElementById('start').onclick=start;document.getElementById('reset').onclick=()=>{clearInterval(timer);timer=null;score=0;time=30;combo=0;running=false;input.disabled=true;input.value='';scoreEl.textContent='0';timeEl.textContent='30';comboEl.textContent='0';wordEl.textContent='准备开始';statusEl.textContent='30 秒内尽可能准确地输入单词。';document.getElementById('start').disabled=false;document.getElementById('start').textContent='开始挑战'};
<\/script></html>`;

    const games = [
      { id: 'click', title: '极速点击', category: '休闲', description: '10 秒挑战手速，支持成绩结算和本局最佳记录。', emoji: '⚡', color: 'linear-gradient(135deg,#6242a6,#29234b)', html: clickGame },
      { id: 'snake', title: '贪吃蛇', category: '街机', description: '键盘或触屏控制方向，包含暂停、重开、碰撞和得分。', emoji: '🐍', color: 'linear-gradient(135deg,#1b7a5c,#17343d)', html: snakeGame },
      { id: '2048', title: '数字 2048', category: '益智', description: '键盘或滑动合并数字，支持撤销一步和胜负提示。', emoji: '🔢', color: 'linear-gradient(135deg,#8066cc,#342c62)', html: game2048 },
      { id: 'memory', title: '记忆翻牌', category: '益智', description: '轻松、标准、挑战三种难度，统计步数和用时。', emoji: '🧠', color: 'linear-gradient(135deg,#4d6bd8,#2b274b)', html: memoryGame },
      { id: 'typing', title: '打字挑战', category: '休闲', description: '30 秒限时打字，实时反馈、连击计数和额外奖励。', emoji: '⌨️', color: 'linear-gradient(135deg,#255b9a,#1c2248)', html: typingGame }
    ];

    const $ = id => document.getElementById(id);
    const grid = $('gameGrid');
    const filters = $('filters');
    const search = $('search');
    const dialog = $('gameDialog');
    let selectedCategory = '全部';
    let activeGame = null;
    $('year').textContent = new Date().getFullYear();

    function renderFilters() {
      const categories = ['全部', ...new Set(games.map(game => game.category))];
      if (!categories.includes(selectedCategory)) selectedCategory = '全部';
      filters.replaceChildren();
      for (const category of categories) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'filter' + (category === selectedCategory ? ' active' : '');
        button.textContent = category;
        button.setAttribute('aria-pressed', String(category === selectedCategory));
        button.addEventListener('click', () => { selectedCategory = category; renderFilters(); renderGames(); });
        filters.appendChild(button);
      }
    }

    function renderGames() {
      const keyword = search.value.trim().toLowerCase();
      const visible = games.filter(game => (selectedCategory === '全部' || game.category === selectedCategory) && (game.title + ' ' + game.description + ' ' + game.category).toLowerCase().includes(keyword));
      $('summary').textContent = '共 ' + games.length + ' 款游戏，当前显示 ' + visible.length + ' 款';
      grid.replaceChildren();
      if (!visible.length) {
        const empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = '没有找到匹配的游戏，换个关键词试试。'; grid.appendChild(empty); return;
      }
      for (const game of visible) {
        const card = document.createElement('article'); card.className = 'card';
        const cover = document.createElement('div'); cover.className = 'cover'; cover.style.background = game.color; cover.textContent = game.emoji;
        const body = document.createElement('div'); body.className = 'card-body';
        const top = document.createElement('div'); top.className = 'card-top';
        const title = document.createElement('h2'); title.textContent = game.title;
        const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = game.category;
        top.append(title, tag);
        const description = document.createElement('p'); description.textContent = game.description;
        const play = document.createElement('button'); play.type = 'button'; play.className = 'play'; play.textContent = '▶ 一键游玩'; play.addEventListener('click', () => openGame(game));
        body.append(top, description, play); card.append(cover, body); grid.appendChild(card);
      }
    }

    function loadGame() {
      const oldFrame = $('gameFrame');
      const newFrame = oldFrame.cloneNode(false);
      newFrame.title = activeGame.title + ' · 游戏运行区域';
      newFrame.srcdoc = activeGame.html;
      oldFrame.replaceWith(newFrame);
    }

    function openGame(game) {
      activeGame = game;
      $('playerTitle').textContent = game.title;
      loadGame();
      if (!dialog.open) dialog.showModal();
    }

    $('restartButton').addEventListener('click', () => { if (activeGame) loadGame(); });
    $('closeButton').addEventListener('click', () => dialog.close());
    dialog.addEventListener('close', () => {
      const frame = $('gameFrame');
      frame.removeAttribute('srcdoc');
      frame.src = 'about:blank';
      activeGame = null;
    });
    $('fullscreenButton').addEventListener('click', async () => {
      try {
        const player = $('player');
        if (document.fullscreenElement) await document.exitFullscreen();
        else if (player.requestFullscreen) await player.requestFullscreen();
      } catch (error) { console.warn('Fullscreen unavailable', error); }
    });
    search.addEventListener('input', renderGames);
    renderFilters();
    renderGames();
  </script>
</body>
</html>
