<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>像素游乐场 · 游戏盒</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--text:#edf2ff;--muted:#99a7c2;--accent:#8b7cff;--border:#ffffff20}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 15% 0%,#29204d 0,transparent 35%),radial-gradient(circle at 90% 25%,#102f40 0,transparent 30%),var(--bg);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #b9b0ff;outline-offset:3px}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0;border-bottom:1px solid var(--border)}.logo{color:var(--text);text-decoration:none;font-size:21px;font-weight:800}.logo span{color:#ad9fff}.button{display:inline-block;padding:10px 15px;color:white;background:#202b43;border:1px solid var(--border);border-radius:11px;text-decoration:none}.button.primary{background:var(--accent);border-color:transparent}.hero{padding:52px 0 28px}.badge{display:inline-block;padding:6px 12px;color:#bcafff;border:1px solid #8b7cff55;border-radius:99px;font-size:13px}h1{margin:16px 0 12px;font-size:clamp(34px,6vw,58px);letter-spacing:-2px}.hero p{max-width:680px;color:var(--muted);line-height:1.8}.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;margin:18px 0}.filters{display:flex;flex-wrap:wrap;gap:8px}.filter{padding:9px 14px;color:var(--muted);background:transparent;border:1px solid var(--border);border-radius:99px}.filter.active{color:#ded8ff;background:#8b7cff25;border-color:#8b7cff}.search{width:min(100%,300px);padding:11px 14px;color:white;background:#131c30;border:1px solid var(--border);border-radius:11px}.summary{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:10px 0 48px}.card{overflow:hidden;background:linear-gradient(150deg,#1b2540,#121b2e);border:1px solid var(--border);border-radius:18px;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-3px);border-color:#8b7cff88}.cover{height:165px;display:grid;place-items:center;overflow:hidden;font-size:65px}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:17px}.title{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.title h2{margin:0;font-size:19px;overflow-wrap:anywhere}.tag{padding:4px 8px;background:#ffffff12;border-radius:6px;color:#c4cce0;font-size:12px;white-space:nowrap}.body p{min-height:46px;color:var(--muted);font-size:14px;line-height:1.7}.play{width:100%;padding:11px;color:white;background:linear-gradient(135deg,#8b7cff,#6577ee);border:0;border-radius:10px;font-weight:700}.empty{grid-column:1/-1;padding:55px;text-align:center;color:var(--muted)}footer{padding:22px 0;color:var(--muted);border-top:1px solid var(--border);font-size:13px;line-height:1.8}dialog{width:min(1050px,calc(100% - 20px));height:min(800px,94dvh);max-height:94dvh;padding:0;color:white;background:#10182a;border:1px solid #39445c;border-radius:16px}dialog::backdrop{background:#030610dd;backdrop-filter:blur(7px)}.player{height:100%;display:flex;flex-direction:column}.player-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px;border-bottom:1px solid var(--border)}.player-head strong{overflow-wrap:anywhere}.player-actions{display:flex;gap:7px}.player-actions button{padding:8px 10px;color:white;background:#202b43;border:1px solid var(--border);border-radius:8px}iframe{display:block;flex:1;min-height:0;width:100%;border:0;background:#0b1020}.player:fullscreen{height:100dvh}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero{padding-top:34px}.search{width:100%}.logo{font-size:18px}.cover{height:150px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header><a class="logo" href="./">🎮 像素<span>游乐场</span></a><a class="button primary" href="./admin.html">⚙ 管理员上传</a></header>
    <main>
      <section class="hero"><span class="badge">独立制作 · 即点即玩</span><h1>快乐，不用下载。</h1><p>欢迎来到我的小游戏世界。挑一款喜欢的游戏，搜索或筛选后即刻开玩。管理员可上传 HTML 游戏和封面，提交后自动加入列表。</p></section>
      <section aria-label="游戏列表"><div class="toolbar"><div id="filters" class="filters" aria-label="游戏分类"></div><input id="search" class="search" type="search" placeholder="🔍 搜索游戏名称、玩法……" aria-label="搜索游戏"></div><p id="summary" class="summary" aria-live="polite">正在加载游戏……</p><div id="grid" class="grid"></div></section>
    </main>
    <footer>© <span id="year"></span> 像素游乐场 · 新上传的游戏发布后会自动出现在这里。</footer>
  </div>
  <dialog id="gameDialog" aria-labelledby="playerTitle"><div id="player" class="player"><div class="player-head"><strong id="playerTitle">游戏</strong><div class="player-actions"><button id="restart" type="button">↻ 重开</button><button id="fullscreen" type="button">⛶ 全屏</button><button id="close" type="button">✕ 关闭</button></div></div><iframe id="frame" title="游戏运行区域" sandbox="allow-scripts allow-pointer-lock" allow="fullscreen" referrerpolicy="no-referrer"></iframe></div></dialog>
  <script>
    'use strict';
    const builtins = [
      {id:'quick-click',title:'极速点击',category:'休闲',description:'在十秒内尽可能多点击，挑战你的手速。',emoji:'⚡',color:'linear-gradient(135deg,#6242a6,#29234b)',html:`<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#312752,#0b1020);color:white;font-family:system-ui;text-align:center}main{padding:20px}.stats{display:flex;justify-content:center;gap:30px;margin:25px}.stats b{display:block;font-size:38px;color:#b7a6ff}button{font:inherit;cursor:pointer}#target{width:165px;height:165px;border:0;border-radius:50%;background:linear-gradient(135deg,#a68bff,#6852e7);color:white;font-size:25px;font-weight:bold}#start{display:block;margin:20px auto;padding:10px 18px;border:1px solid #ffffff44;border-radius:9px;background:#ffffff18;color:white}p{color:#b9b5cf}</style><main><h1>⚡ 极速点击</h1><p>10 秒内尽可能多地点击！</p><div class="stats"><span><b id="s">0</b>点击</span><span><b id="t">10.0</b>秒</span></div><button id="target" disabled>点我！</button><button id="start">开始挑战</button><p id="r">准备好了吗？</p></main><script>let score=0,end=0,timer=null,running=false;const target=document.getElementById('target'),start=document.getElementById('start');function finish(){if(!running)return;running=false;clearInterval(timer);target.disabled=true;start.disabled=false;start.textContent='再挑战一次';document.getElementById('t').textContent='0.0';document.getElementById('r').textContent='完成！点击 '+score+' 次。'}start.onclick=()=>{score=0;running=true;target.disabled=false;start.disabled=true;document.getElementById('s').textContent='0';document.getElementById('t').textContent='10.0';end=performance.now()+10000;timer=setInterval(()=>{let n=Math.max(0,end-performance.now());document.getElementById('t').textContent=(n/1000).toFixed(1);if(!n)finish()},30)};target.onclick=()=>{if(running&&performance.now()<end)document.getElementById('s').textContent=++score;else finish()}<\/script>`},
      {id:'mini-2048',title:'数字 2048',category:'益智',description:'使用方向键合并数字，挑战 2048。',emoji:'🔢',color:'linear-gradient(135deg,#8066cc,#342c62)',html:`<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#17162e;color:white;font-family:system-ui;text-align:center}main{width:min(94vw,400px)}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:8px;background:#ffffff22;border-radius:10px}.cell{aspect-ratio:1;display:grid;place-items:center;border-radius:7px;background:#eee8db;color:#343047;font-size:clamp(20px,7vw,34px);font-weight:bold}.v0{background:#ffffff12;color:transparent}button{padding:9px 14px;border:0;border-radius:8px;background:#8b7cff;color:white}</style><main><h1>🔢 2048</h1><p>分数：<b id="score">0</b>　<button id="new">新游戏</button></p><div id="board"></div><p>方向键或 WASD 移动</p></main><script>let g,s=0;const el=document.getElementById('board');function spawn(){let a=[];g.forEach((r,y)=>r.forEach((v,x)=>{if(!v)a.push([y,x])}));if(a.length){let [y,x]=a[Math.floor(Math.random()*a.length)];g[y][x]=Math.random()<.9?2:4}}function draw(){el.replaceChildren();g.flat().forEach(v=>{let d=document.createElement('div');d.className='cell v'+(v||0);d.textContent=v||'';el.append(d)});document.getElementById('score').textContent=s}function init(){g=Array.from({length:4},()=>[0,0,0,0]);s=0;spawn();spawn();draw()}function move(d){let old=JSON.stringify(g);for(let i=0;i<4;i++){let line=[];for(let j=0;j<4;j++){let y=d==='up'?j:d==='down'?3-j:i,x=d==='left'?j:d==='right'?3-j:i;line.push(g[y][x])}let a=line.filter(Boolean),o=[];for(let j=0;j<a.length;j++){if(a[j]===a[j+1]){o.push(a[j]*2);s+=a[j]*2;j++}else o.push(a[j])}while(o.length<4)o.push(0);for(let j=0;j<4;j++){let y=d==='up'?j:d==='down'?3-j:i,x=d==='left'?j:d==='right'?3-j:i;g[y][x]=o[j]}}if(JSON.stringify(g)!==old)spawn();draw()}document.addEventListener('keydown',e=>{let d={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'}[e.key];if(d){e.preventDefault();move(d)}});document.getElementById('new').onclick=init;init()<\/script>`}
    ];
    const $=id=>document.getElementById(id);let games=[...builtins],category='全部',active=null;
    $('year').textContent=new Date().getFullYear();
    function renderFilters(){const cats=['全部',...new Set(games.map(g=>g.category))];if(!cats.includes(category))category='全部';$('filters').replaceChildren();cats.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='filter'+(c===category?' active':'');b.textContent=c;b.setAttribute('aria-pressed',String(c===category));b.onclick=()=>{category=c;renderFilters();renderGames()};$('filters').append(b)})}
    function renderGames(){const key=$('search').value.trim().toLowerCase();const found=games.filter(g=>(category==='全部'||g.category===category)&&(g.title+' '+g.description+' '+g.category).toLowerCase().includes(key));$('summary').textContent=`共 ${games.length} 款游戏，当前显示 ${found.length} 款`;$('grid').replaceChildren();if(!found.length){const e=document.createElement('div');e.className='empty';e.textContent='还没有游戏，管理员可以上传 HTML 游戏。';$('grid').append(e);return}found.forEach(g=>{const card=document.createElement('article');card.className='card';const cover=document.createElement('div');cover.className='cover';cover.style.background=g.color||'#263453';if(g.cover){const img=document.createElement('img');img.src=g.cover;img.alt='';img.loading='lazy';img.onerror=()=>{img.remove();cover.textContent=g.emoji||'🎮'};cover.append(img)}else cover.textContent=g.emoji||'🎮';const body=document.createElement('div');body.className='body';const top=document.createElement('div');top.className='title';const h=document.createElement('h2');h.textContent=g.title;const tag=document.createElement('span');tag.className='tag';tag.textContent=g.category;top.append(h,tag);const p=document.createElement('p');p.textContent=g.description||'即点即玩。';const play=document.createElement('button');play.className='play';play.type='button';play.textContent='▶ 开始游戏';play.onclick=()=>openGame(g);body.append(top,p,play);card.append(cover,body);$('grid').append(card)})}
    function loadGame(){const old=$('frame'),next=old.cloneNode(false);next.title=active.title+' · 游戏运行区域';if(typeof active.html==='string')next.srcdoc=active.html;else next.src=new URL(active.url,document.baseURI).href;old.replaceWith(next)}
    function openGame(g){active=g;$('playerTitle').textContent=g.title;loadGame();if(!$('gameDialog').open)$('gameDialog').showModal()}
    $('restart').onclick=()=>{if(active)loadGame()};$('close').onclick=()=>$('gameDialog').close();$('gameDialog').addEventListener('close',()=>{const f=$('frame');f.removeAttribute('srcdoc');f.src='about:blank';active=null});$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('player').requestFullscreen()}catch(error){console.warn(error)}};$('search').addEventListener('input',renderGames);
    async function loadCatalog(){try{const response=await fetch('./games.json?'+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('catalog unavailable');const catalog=await response.json();if(Array.isArray(catalog.games)){games=[...builtins,...catalog.games];renderFilters();renderGames()}}catch(error){console.info('Using built-in games only.',error)}}
    renderFilters();renderGames();loadCatalog();
  </script>
</body>
</html>
