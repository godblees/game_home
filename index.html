<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>像素游乐场 · 在线小游戏</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #141c31;
      --text: #edf2ff;
      --muted: #99a7c2;
      --accent: #8b7cff;
      --border: rgba(255,255,255,.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0%, #29204d 0, transparent 35%),
        radial-gradient(circle at 90% 30%, #102f40 0, transparent 30%),
        var(--bg);
      font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }
    .wrap { width: min(1120px, calc(100% - 36px)); margin: auto; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 25px 0; border-bottom: 1px solid var(--border);
    }
    .logo {
      color: var(--text); text-decoration: none; font-size: 21px; font-weight: 800;
    }
    .logo span { color: #ad9fff; }
    .badge {
      display: inline-block; padding: 6px 12px; color: #bcafff; border: 1px solid #8b7cff55; border-radius: 100px; font-size: 13px;
    }
    .hero { padding: 58px 0 30px; }
    h1 {
      margin: 18px 0 14px; font-size: clamp(32px, 6vw, 58px); letter-spacing: -2px; line-height: 1.15;
    }
    .hero p {
      max-width: 650px; color: var(--muted); line-height: 1.8; font-size: 15px;
    }
    .toolbar {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin: 18px 0 20px;
    }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter {
      padding: 9px 15px; color: var(--muted); background: transparent; border: 1px solid var(--border); border-radius: 100px; border-color: var(--border);
    }
    .filter.active {
      color: #ded8ff; background: rgba(139,124,255,0.15); border-color: rgba(139,124,255,.8);
    }
    .search {
      width: min(100%, 290px); padding: 11px 15px; color: white; background: #131c30; border: 1px solid var(--border); border-radius: 12px;
    }
    .summary {
      margin: 0 0 14px; color: var(--muted); font-size: 13px;
    }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; padding-bottom: 45px; }
    .card {
      display: flex; flex-direction: column; overflow: hidden; background: linear-gradient(150deg, #1b2540, #121b2e); border: 1px solid var(--border); border-radius: 20px; transition: transform .2s, border-color .2s;
    }
    .card:hover { transform: translateY(-4px); border-color: #8b7cff88; }
    .cover {
      position: relative; display: grid; place-items: center; height: 170px; overflow: hidden; background: #263453; font-size: 68px;
    }
    .card-body { display: flex; flex: 1; flex-direction: column; padding: 20px; }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .card h2 { margin: 0; font-size: 20px; }
    .tag { padding: 4px 8px; color: #bbc7df; background: #ffffff0c; border-radius: 6px; font-size: 12px; white-space: nowrap; }
    .card p {
      flex: 1; min-height: 52px; color: var(--muted); font-size: 14px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .play {
      width: 100%; padding: 12px 16px; border: 0; border-radius: 12px; background: var(--accent); color: white; font-weight: 700;
    }
    .empty {
      grid-column: 1 / -1; padding: 60px 20px; color: var(--muted); text-align: center;
    }
    footer {
      padding: 24px 0; color: var(--muted); border-top: 1px solid var(--border); font-size: 13px; line-height: 1.8;
    }
    dialog {
      width: min(1100px, calc(100% - 24px)); max-height: 95dvh; padding: 0; color: white; background: #10182a; border: 1px solid #39445c; border-radius: 18px;
    }
    dialog::backdrop { background: #030610d9; backdrop-filter: blur(8px); }
    .player {
      display: flex; flex-direction: column; height: min(780px, 88dvh);
    }
    .player-header {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border);
    }
    .player-actions { display: flex; gap: 8px; }
    .player-actions button {
      padding: 8px 10px; color: var(--text); background: #202b43; border: 1px solid var(--border); border-radius: 9px; font-size: 13px;
    }
    iframe {
      display: block; flex: 1; width: 100%; min-height: 0; background: #0b1020; border: 0;
    }
    @media (max-width: 850px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      .hero { padding-top: 36px; }
      .search { width: 100%; }
      .logo { font-size: 18px; }
      .cover { height: 160px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="logo" href="./">🎮 像素<span>游乐场</span></a>
      <span class="badge">在线游戏集合</span>
    </header>

    <main>
      <section class="hero">
        <span class="badge">独立制作 · 即点即玩</span>
        <h1>快乐，不用下载。</h1>
        <p>欢迎来到我的小游戏世界。这里汇集了多个网页小游戏，选择一个喜欢的，马上开始挑战吧。</p>
      </section>

      <section aria-label="游戏列表">
        <div class="toolbar">
          <div id="filters" class="filters" aria-label="游戏分类"></div>
          <input id="search" class="search" type="search" placeholder="🔍 搜索游戏名称、玩法……" aria-label="搜索游戏">
        </div>
        <p id="summary" class="summary" aria-live="polite"></p>
        <div id="gameGrid" class="grid"></div>
      </section>
    </main>

    <footer>
      © <span id="year"></span> 像素游乐场 · 我的创意，我的游戏<br>
      这是一个单页静态网站，直接部署在 GitHub Pages 即可访问。
    </footer>
  </div>

  <dialog id="gameDialog" aria-labelledby="playerTitle">
    <div class="player">
      <div class="player-header">
        <strong id="playerTitle">游戏</strong>
        <div class="player-actions">
          <button id="restartButton" type="button">↻ 重开</button>
          <button id="fullscreenButton" type="button">⛶ 全屏</button>
          <button id="closeButton" type="button">✕ 关闭</button>
        </div>
      </div>
      <iframe id="gameFrame" title="游戏运行区域" sandbox="allow-scripts allow-pointer-lock" allow="fullscreen" referrerpolicy="no-referrer"></iframe>
    </div>
  </dialog>

  <script>
    "use strict";

    const clickGame = `
      <!DOCTYPE html>
      <html lang="zh-CN">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <style>
          * { box-sizing: border-box; }
          body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            text-align: center; color: white; background: radial-gradient(circle at top, #312752, #0b1020 75%);
            font-family: system-ui, sans-serif;
          }
          main { width: min(100%, 480px); padding: 24px; }
          h1 { font-size: 30px; margin-bottom: 12px; }
          p { color: #b9b5cf; line-height: 1.7; }
          .stats {
            display: flex; justify-content: center; gap: 35px; margin: 28px 0;
          }
          .stats strong {
            display: block; color: #b7a6ff; font-size: 40px;
          }
          .stats span { color: #aaa5c4; font-size: 14px; }
          button { font: inherit; cursor: pointer; }
          #target {
            width: 170px; height: 170px; color: white; background: linear-gradient(135deg, #a68bff, #6852e7);
            border: 0; border-radius: 50%; box-shadow: 0 12px 50px rgba(139,124,255,0.35); font-size: 26px; font-weight: bold;
          }
          #target:disabled { opacity: .6; cursor: default; }
          #start {
            display: block; margin: 24px auto 0; padding: 12px 24px; color: white; background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.25); border-radius: 10px;
          }
          #result { min-height: 54px; }
        </style>
      </head>
      <body>
        <main>
          <h1>⚡ 极速点击</h1>
          <p>在 10 秒内尽可能多地点击按钮，挑战你的手速！</p>
          <div class="stats">
            <div><strong id="score">0</strong><span>点击次数</span></div>
            <div><strong id="time">10.0</strong><span>剩余秒数</span></div>
          </div>
          <button id="target" disabled>点我！</button>
          <button id="start">开始挑战</button>
          <p id="result" aria-live="polite">准备好了吗？</p>
        </main>
        <script>
          const target = document.getElementById("target");
          const start = document.getElementById("start");
          const scoreText = document.getElementById("score");
          const timeText = document.getElementById("time");
          const result = document.getElementById("result");
          let score = 0;
          let endTime = 0;
          let timer = null;
          let running = false;
          let best = Number(localStorage.getItem("clickBest") || 0);

          function finish() {
            if (!running) return;
            running = false;
            clearInterval(timer);
            target.disabled = true;
            start.disabled = false;
            start.textContent = "再挑战一次";
            timeText.textContent = "0.0";
            result.textContent = "挑战完成！共点击 " + score + " 次，平均每秒 " + (score / 10).toFixed(1) + " 次。";
            if (score > best) {
              best = score;
              localStorage.setItem("clickBest", String(best));
            }
          }

          start.addEventListener("click", () => {
            clearInterval(timer);
            score = 0;
            running = true;
            scoreText.textContent = "0";
            timeText.textContent = "10.0";
            result.textContent = "加油，冲击更高分！";
            target.disabled = false;
            start.disabled = true;
            endTime = performance.now() + 10000;
            target.focus();

            timer = setInterval(() => {
              const remaining = Math.max(0, endTime - performance.now());
              timeText.textContent = (remaining / 1000).toFixed(1);
              if (remaining === 0) finish();
            }, 30);
          });

          target.addEventListener("click", () => {
            if (!running) return;
            if (performance.now() >= endTime) {
              finish();
              return;
            }
            scoreText.textContent = ++score;
          });
        <\/script>
      </body>
      </html>
    `;

    const snakeGame = `
      <!DOCTYPE html>
      <html lang="zh-CN">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
          * { box-sizing: border-box; }
          body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
            color: white; background: radial-gradient(circle at top, #17392f, #0b1020 70%);
            font-family: system-ui, sans-serif;
          }
          main { width: min(100%, 480px); padding: 16px; }
          h1 { margin-bottom: 10px; }
          .hud {
            display: flex; justify-content: center; gap: 20px; margin: 16px 0; color: #d3f5e6; font-size: 14px;
          }
          .hud strong { display: block; color: #92efc7; font-size: 28px; }
          canvas {
            display: block; width: min(82vw, 360px); height: auto; margin: auto; background: #0f1e1a; border: 2px solid #3b6c5e; border-radius: 12px;
          }
          .row { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
          .button {
            padding: 9px 14px; color: white; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); border-radius: 10px; font: inherit;
          }
          .pad {
            display: grid; grid-template-columns: repeat(3, 52px); gap: 6px; justify-content: center; margin-top: 12px;
          }
          .pad button { padding: 10px; color: white; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); border-radius: 10px; }
          .hint { color: #cfeadf; font-size: 13px; margin-top: 10px; }
        </style>
      </head>
      <body>
        <main>
          <h1>🐍 贪吃蛇</h1>
          <div class="hud">
            <div><strong id="score">0</strong>分数</div>
            <div><strong id="best">0</strong>最佳</div>
          </div>
          <canvas id="board" width="360" height="360" aria-label="贪吃蛇游戏区域"></canvas>
          <div class="row">
            <button id="toggle" class="button" type="button">开始游戏</button>
            <button id="reset" class="button" type="button">重新开始</button>
          </div>
          <div class="pad">
            <span></span>
            <button type="button" data-dir="up">▲</button>
            <span></span>
            <button type="button" data-dir="left">◀</button>
            <button type="button" data-dir="down">▼</button>
            <button type="button" data-dir="right">▶</button>
          </div>
          <div class="hint">方向键 / WASD 或触屏按钮控制；空格可暂停。</div>
        </main>
        <script>
          const canvas = document.getElementById("board");
          const ctx = canvas.getContext("2d");
          const scoreEl = document.getElementById("score");
          const bestEl = document.getElementById("best");
          const toggle = document.getElementById("toggle");
          const grid = 18;
          const cell = canvas.width / grid;

          let snake = [{ x: 8, y: 9 }, { x: 7, y: 9 }, { x: 6, y: 9 }];
          let dir = { x: 1, y: 0 };
          let nextDir = { x: 1, y: 0 };
          let food = { x: 12, y: 9 };
          let score = 0;
          let best = Number(localStorage.getItem("snakeBest") || 0);
          let timer = null;
          let paused = true;
          let gameOver = false;

          bestEl.textContent = best;

          function randomFood() {
            let x; let y;
            do {
              x = Math.floor(Math.random() * grid);
              y = Math.floor(Math.random() * grid);
            } while (snake.some(seg => seg.x === x && seg.y === y));
            food = { x, y };
          }

          function draw() {
            ctx.fillStyle = "#0f1e1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#18352d";
            for (let i = 0; i <= grid; i++) {
              ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, canvas.height); ctx.stroke();
              ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(canvas.width, i * cell); ctx.stroke();
            }

            ctx.fillStyle = "#ffbd59";
            ctx.fillRect(food.x * cell + 4, food.y * cell + 4, cell - 8, cell - 8);

            snake.forEach((seg, index) => {
              ctx.fillStyle = index === 0 ? "#a1ffd6" : "#45c997";
              ctx.fillRect(seg.x * cell + 2, seg.y * cell + 2, cell - 4, cell - 4);
            });

            if (gameOver) {
              ctx.fillStyle = "#0009";
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.fillStyle = "white";
              ctx.font = "bold 24px sans-serif";
              ctx.textAlign = "center";
              ctx.fillText("游戏结束 · " + score + " 分", canvas.width / 2, canvas.height / 2 - 10);
            }
          }

          function reset() {
            clearInterval(timer);
            timer = null;
            snake = [{ x: 8, y: 9 }, { x: 7, y: 9 }, { x: 6, y: 9 }];
            dir = { x: 1, y: 0 };
            nextDir = { x: 1, y: 0 };
            score = 0;
            gameOver = false;
            paused = true;
            scoreEl.textContent = "0";
            toggle.textContent = "开始游戏";
            randomFood();
            draw();
          }

          function start() {
            if (gameOver) {
              reset();
            }
            if (timer) {
              paused = !paused;
              toggle.textContent = paused ? "继续" : "暂停";
              return;
            }
            paused = false;
            toggle.textContent = "暂停";
            timer = setInterval(tick, 125);
          }

          function tick() {
            if (paused) return;
            dir = nextDir;
            const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
            const willEat = head.x === food.x && head.y === food.y;
            const body = willEat ? snake : snake.slice(0, -1);

            if (head.x < 0 || head.y < 0 || head.x >= grid || head.y >= grid || body.some(seg => seg.x === head.x && seg.y === head.y)) {
              clearInterval(timer);
              timer = null;
              gameOver = true;
              paused = true;
              toggle.textContent = "再来一局";
              if (score > best) {
                best = score;
                localStorage.setItem("snakeBest", String(best));
                bestEl.textContent = best;
              }
              draw();
              return;
            }

            snake.unshift(head);
            if (willEat) {
              score += 10;
              scoreEl.textContent = score;
              randomFood();
            } else {
              snake.pop();
            }
            draw();
          }

          document.getElementById("toggle").addEventListener("click", start);
          document.getElementById("reset").addEventListener("click", reset);

          document.addEventListener("keydown", (event) => {
            const map = {
              ArrowUp: { x: 0, y: -1 },
              ArrowDown: { x: 0, y: 1 },
              ArrowLeft: { x: -1, y: 0 },
              ArrowRight: { x: 1, y: 0 },
              w: { x: 0, y: -1 },
              s: { x: 0, y: 1 },
              a: { x: -1, y: 0 },
              d: { x: 1, y: 0 }
            };
            const newDir = map[event.key];
            if (!newDir) {
              if (event.code === "Space") { event.preventDefault(); start(); }
              return;
            }
            if (newDir.x !== -dir.x || newDir.y !== -dir.y) {
              nextDir = newDir;
            }
          });

          document.querySelectorAll("[data-dir]").forEach(button => {
            button.addEventListener("click", () => {
              const m = {
                up: { x: 0, y: -1 },
                down: { x: 0, y: 1 },
                left: { x: -1, y: 0 },
                right: { x: 1, y: 0 }
              }[button.dataset.dir];
              if (m.x !== -dir.x || m.y !== -dir.y) nextDir = m;
            });
          });

          reset();
        <\/script>
      </body>
      </html>
    `;

    const memoryGame = `
      <!DOCTYPE html>
      <html lang="zh-CN">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <style>
          * { box-sizing: border-box; }
          body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; color: white; background: radial-gradient(circle at top, #2d2a5d, #0b1020 75%);
            font-family: system-ui, sans-serif; text-align: center;
          }
          main { width: min(100%, 520px); padding: 16px; }
          h1 { margin: 0; }
          .stats {
            display: flex; justify-content: center; gap: 18px; margin: 12px 0 18px; color: #ddd6ff; font-size: 14px;
          }
          .stats strong { display: block; font-size: 26px; color: #c4b6ff; }
          .board {
            display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;
          }
          .card {
            height: 88px; color: white; background: linear-gradient(135deg, #7c6dec, #4f76ff); border: 0; border-radius: 14px; font-size: 32px; cursor: pointer; box-shadow: 0 10px 30px rgba(109,91,220,.25);
          }
          .card.open, .card.done {
            color: #1b2140; background: linear-gradient(135deg, #dfe8ff, #c5d3ff);
          }
          .card.done { opacity: .8; }
          button { font: inherit; }
          .reset { margin-top: 14px; padding: 10px 18px; color: white; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.24); border-radius: 10px; }
        </style>
      </head>
      <body>
        <main>
          <h1>🧠 记忆翻牌</h1>
          <div class="stats">
            <div><strong id="moves">0</strong>步数</div>
            <div><strong id="time">0</strong>秒</div>
            <div><strong id="pairs">0/8</strong>配对</div>
          </div>
          <div id="board" class="board"></div>
          <button class="reset" id="resetBtn" type="button">重新开始</button>
        </main>
        <script>
          const board = document.getElementById("board");
          const movesEl = document.getElementById("moves");
          const timeEl = document.getElementById("time");
          const pairsEl = document.getElementById("pairs");
          const resetBtn = document.getElementById("resetBtn");
          const icons = ["🍉", "🍋", "🍒", "🍇", "🍊", "🍎", "🍓", "🥝"];

          let cards = [];
          let opened = [];
          let moves = 0;
          let matched = 0;
          let seconds = 0;
          let timer = null;
          let locked = false;

          function shuffle(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
          }

          function startTimer() {
            if (timer) return;
            timer = setInterval(() => {
              seconds += 1;
              timeEl.textContent = seconds;
            }, 1000);
          }

          function stopTimer() {
            clearInterval(timer);
            timer = null;
          }

          function buildBoard() {
            const values = shuffle([...icons, ...icons]);
            board.replaceChildren();
            cards = values.map((icon) => {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.className = "card";
              btn.textContent = "?";
              btn.addEventListener("click", () => {
                if (locked || btn.classList.contains("open") || btn.classList.contains("done")) return;
                startTimer();
                btn.classList.add("open");
                btn.textContent = icon;
                opened.push({ btn, icon });

                if (opened.length !== 2) return;
                moves += 1;
                movesEl.textContent = moves;

                const [first, second] = opened;
                if (first.icon === second.icon) {
                  first.btn.classList.add("done");
                  second.btn.classList.add("done");
                  matched += 1;
                  pairsEl.textContent = matched + "/8";
                  opened = [];
                  if (matched === 8) {
                    stopTimer();
                    setTimeout(() => alert("通关成功！用时 " + seconds + " 秒，步数 " + moves + "。"), 150);
                  }
                } else {
                  locked = true;
                  setTimeout(() => {
                    first.btn.classList.remove("open");
                    second.btn.classList.remove("open");
                    first.btn.textContent = "?";
