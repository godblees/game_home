<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>像素游乐场 · 游戏盒</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #141c31;
      --text: #edf2ff;
      --muted: #99a7c2;
      --accent: #8b7cff;
      --accent2: #66d9ef;
      --border: rgba(255,255,255,.12);
      --success: #8ef0c6;
      --warning: #ffd166;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0%, #29204d 0, transparent 35%),
        radial-gradient(circle at 90% 25%, #102f40 0, transparent 30%),
        var(--bg);
      font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #b9b0ff; outline-offset: 3px; }
    a { color: inherit; }
    [hidden] { display: none !important; }

    .wrap { width: min(1160px, calc(100% - 28px)); margin: 0 auto; }

    header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 22px 0 18px; border-bottom: 1px solid var(--border);
    }
    .logo {
      color: var(--text); text-decoration: none; font-size: 21px; font-weight: 800; letter-spacing: .2px;
    }
    .logo span { color: #ad9fff; }
    .topActions { display: flex; align-items: center; gap: 10px; }
    .pill {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 8px 14px; color: var(--text); background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 999px;
      font-size: 13px;
    }

    .hero {
      display: grid; grid-template-columns: 1.2fr .8fr; gap: 24px; align-items: stretch;
      padding: 44px 0 26px;
    }
    .hero-copy {
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015));
      border: 1px solid var(--border); border-radius: 28px; padding: 28px 28px 22px;
    }
    .badge {
      display: inline-block; padding: 7px 12px; color: #bcafff; background: rgba(139,124,255,.08);
      border: 1px solid rgba(139,124,255,.35); border-radius: 999px; font-size: 12px; letter-spacing: .4px;
    }
    h1 {
      margin: 18px 0 14px; font-size: clamp(36px, 6vw, 62px); line-height: 1.08; letter-spacing: -2px;
    }
    .hero p { color: var(--muted); line-height: 1.8; margin: 0; font-size: 15px; }
    .heroActions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
    .button {
      appearance: none; border: 1px solid var(--border); border-radius: 12px; background: rgba(255,255,255,.04);
      color: var(--text); padding: 11px 16px; font-weight: 700; transition: transform .2s ease, filter .2s ease;
    }
    .button:hover { transform: translateY(-1px); filter: brightness(1.06); }
    .button.primary {
      background: linear-gradient(135deg, var(--accent), #5d7dff); border-color: transparent;
      box-shadow: 0 10px 24px rgba(139,124,255,.28);
    }
    .button.gold {
      background: linear-gradient(135deg, #f0ca76, #d98c32); border-color: transparent; color: #1d1f2a;
    }

    .statsCard {
      display: grid; gap: 14px; padding: 18px; border: 1px solid var(--border); border-radius: 28px;
      background: linear-gradient(180deg, rgba(17,23,38,.9), rgba(18,24,41,.7));
    }
    .miniStat {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 16px; background: rgba(255,255,255,.02);
    }
    .miniStat strong {
      display: block; font-size: 26px; letter-spacing: -1px;
    }
    .miniStat small { color: var(--muted); }

    .toolbar {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px;
      margin: 8px 0 18px; align-items: center;
    }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter {
      padding: 9px 14px; color: var(--muted); background: rgba(255,255,255,.02); border: 1px solid var(--border); border-radius: 999px;
    }
    .filter.active {
      color: #ded8ff; background: rgba(139,124,255,.15); border-color: rgba(139,124,255,.7);
    }
    .search {
      width: min(100%, 300px); padding: 11px 14px; color: white; background: rgba(19,28,48,.9); border: 1px solid var(--border); border-radius: 12px;
    }

    .summary { margin: 10px 0 18px; color: var(--muted); font-size: 13px; }
    .grid {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px;
      padding-bottom: 46px;
    }
    .card {
      display: flex; flex-direction: column; overflow: hidden; background: linear-gradient(150deg, #1b2540, #121b2e);
      border: 1px solid var(--border); border-radius: 22px; transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    .card:hover {
      transform: translateY(-4px); border-color: rgba(139,124,255,.8); box-shadow: 0 12px 28px rgba(0,0,0,.18);
    }
    .cover {
      display: grid; place-items: center; height: 170px; overflow: hidden; font-size: 68px; font-weight: 700;
    }
    .card-body { display: flex; flex: 1; flex-direction: column; padding: 18px 18px 16px; }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .card-top h2 {
      margin: 0; font-size: 20px; line-height: 1.35; overflow-wrap: anywhere;
    }
    .tag {
      padding: 4px 8px; color: #bbc7df; background: rgba(255,255,255,.08); border-radius: 6px; font-size: 12px; white-space: nowrap;
    }
    .card p {
      flex: 1; min-height: 52px; color: var(--muted); line-height: 1.7; font-size: 14px; margin: 12px 0 16px; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .play {
      width: 100%; display: block; text-align: center; color: white; background: linear-gradient(135deg, var(--accent), #6d7ef5);
      border: 0; border-radius: 12px; padding: 11px 12px; font-weight: 700;
    }
    .empty {
      grid-column: 1 / -1; padding: 60px 20px; color: var(--muted); text-align: center; font-size: 15px;
    }

    footer {
      padding: 18px 0 28px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); line-height: 1.8;
    }

    dialog {
      width: min(1120px, calc(100% - 22px)); max-height: 94dvh; padding: 0; border: 1px solid #39445c; border-radius: 18px; color: white; background: #10182a;
    }
    dialog::backdrop { background: rgba(3,6,16,.86); backdrop-filter: blur(8px); }
    .player {
      display: flex; flex-direction: column; height: min(800px, 88dvh);
    }
    .player-header {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border);
    }
    #playerTitle { overflow-wrap: anywhere; }
    .player-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .player-actions button {
      padding: 8px 10px; color: var(--text); background: #202b43; border: 1px solid var(--border); border-radius: 9px; font-size: 13px;
    }
    iframe {
      display: block; width: 100%; flex: 1; min-height: 0; background: #0b1020; border: 0;
    }

    @media (max-width: 920px) {
      .hero { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      .hero { padding-top: 26px; }
      .search { width: 100%; }
      .button, .pill { font-size: 13px; }
      .cover { height: 150px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="logo" href="./">🎮 像素<span>游乐场</span></a>
      <div class="topActions">
        <span class="pill">游戏盒 · 6 款</span>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <span class="badge">独立制作 · 即点即玩</span>
          <h1>快乐，不用下载。</h1>
          <p>这是一个单页小游戏合集，精选了点击、益智、动作和打字类小游戏。找一款自己喜欢的，立刻开始挑战。</p>
          <div class="heroActions">
            <button class="button primary" type="button" onclick="document.getElementById('search').focus();">开始挑游戏</button>
            <button class="button gold" type="button" onclick="openFirstGame();">随机推荐</button>
          </div>
        </div>

        <div class="statsCard" aria-label="站点统计">
          <div class="miniStat">
            <div>
              <strong id="totals">6</strong>
              <small>精选游戏</small>
            </div>
            <div>🎯</div>
          </div>
          <div class="miniStat">
            <div>
              <strong>100%</strong>
              <small>纯前端</small>
            </div>
            <div>⚡</div>
          </div>
          <div class="miniStat">
            <div>
              <strong>无依赖</strong>
              <small>直接打开</small>
            </div>
            <div>✨</div>
          </div>
        </div>
      </section>

      <section aria-label="游戏列表">
        <div class="toolbar">
          <div id="filters" class="filters" aria-label="游戏分类"></div>
          <input id="search" class="search" type="search" placeholder="🔍 搜索游戏名称、玩法……" aria-label="搜索游戏">
        </div>
        <p id="summary" class="summary" aria-live="polite"></p>
        <div id="gameGrid" class="grid"></div>
      </section>
    </main>

    <footer>
      © <span id="year"></span> 像素游乐场 · 纯前端小游戏站，直接部署即可访问。<br>
      GitHub Pages 访问地址：<code>https://godblees.github.io/game_home/</code>
    </footer>
  </div>

  <dialog id="gameDialog" aria-labelledby="playerTitle">
    <div class="player">
      <div class="player-header">
        <strong id="playerTitle">游戏</strong>
        <div class="player-actions">
          <button id="restartButton" type="button">↻ 重开</button>
          <button id="fullscreenButton" type="button">⛶ 全屏</button>
          <button id="closeButton" type="button">✕ 关闭</button>
        </div>
      </div>
      <iframe id="gameFrame" title="游戏运行区域" sandbox="allow-scripts allow-pointer-lock" allow="fullscreen" referrerpolicy="no-referrer"></iframe>
    </div>
  </dialog>

  <script>
    "use strict";

    const clickGame = `<!DOCTYPE html>
      <html lang="zh-CN">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
          * { box-sizing: border-box; }
          body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; color: white; background: radial-gradient(circle at top, #312752, #0b1020 75%);
            font-family: system-ui, sans-serif; text-align: center;
          }
          main { width: min(100%, 480px); padding: 24px; }
          h1 { margin: 12px 0; font-size: 32px; }
          p { color: #b9b5cf; line-height: 1.7; }
          .stats { display: flex; justify-content: center; gap: 30px; margin: 28px 0; }
          .stats strong { display: block; color: #b7a6ff; font-size: 42px; }
          .stats span { color: #aaa5c4; font-size: 14px; }
          button { font: inherit; cursor: pointer; }
          #target {
            width: 170px; height: 170px; border: 0; border-radius: 50%; color: white; background: linear-gradient(135deg, #a68bff, #6852e7);
            box-shadow: 0 12px 50px rgba(139,124,255,.35); font-size: 26px; font-weight: bold; touch-action: manipulation;
          }
          #target:disabled { opacity: .6; cursor: default; }
          #start {
            display: block; margin: 22px auto 0; padding: 12px 24px; color: white; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,.25); border-radius: 10px;
          }
          #result { min-height: 54px; }
        </style>
      </head>
      <body>
        <main>
          <h1>⚡ 极速点击</h1>
          <p>在 10 秒内尽可能多地点击按钮，挑战你的手速！</p>
          <div class="stats">
            <div><strong id="score">0</strong><span>点击次数</span></div>
            <div><strong id="time">10.0</strong><span>剩余秒数</span></div>
          </div>
          <button id="target" disabled>点我！</button>
          <button id="start">开始挑战</button>
          <p id="result" aria-live="polite">准备好了吗？</p>
        </main>
        <script>
          const target = document.getElementById('target');
          const startBtn = document.getElementById('start');
          const scoreText = document.getElementById('score');
          const timeText = document.getElementById('time');
          const result = document.getElementById('result');
          let score = 0;
          let timer = null;
          let running = false;
          let endTime = 0;

          function finish() {
            if (!running) return;
            running = false;
            clearInterval(timer);
            target.disabled = true;
            startBtn.disabled = false;
            startBtn.textContent = '再挑战一次';
            timeText.textContent = '0.0';
            result.textContent = '挑战完成！共点击 ' + score + ' 次，平均每秒 ' + (score / 10).toFixed(1) + ' 次。';
          }

          startBtn.addEventListener('click', () => {
            clearInterval(timer);
            score = 0;
            running = true;
            scoreText.textContent = '0';
            timeText.textContent = '10.0';
            result.textContent = '加油，冲击更高分！';
            target.disabled = false;
            startBtn.disabled = true;
            endTime = performance.now() + 10000;
            target.focus();

            timer = setInterval(() => {
              const remaining = Math.max(0, endTime - performance.now());
              timeText.textContent = (remaining / 1000).toFixed(1);
              if (remaining === 0) finish();
            }, 30);
          });

          target.addEventListener('click', () => {
            if (!running) return;
            if (performance.now() >= endTime) {
              finish();
              return;
            }
            scoreText.textContent = String(++score);
          });
        <\/script>
      </body>
      </html>`;

    const snakeGame = `<!DOCTYPE html>
      <html lang="zh-CN">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
          * { box-sizing: border-box; }
          body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; color: white; background: radial-gradient(circle at top, #17392f, #0b1020 70%);
            font-family: system-ui, sans-serif; text-align: center;
          }
          main { width: min(100%, 470px); padding: 14px; }
          h1 { margin: 4px; }
          .hud { display: flex; justify-content: center; gap: 24px; margin: 12px 0; color: #d3f5e6; font-size: 14px; }
          .hud strong { display: block; color: #92efc7; font-size: 28px; }
          canvas { display: block; width: min(82vw, 360px); height: auto; margin: auto; background: #0f1e1a; border: 2px solid #3b6c5e; border-radius: 12px; }
          .row { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
          .btn, .pad button { padding: 9px 14px; color: white; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); border-radius: 10px; font: inherit; }
          .pad { display: grid; grid-template-columns: repeat(3, 52px); gap: 6px; justify-content: center; margin-top: 12px; }
          .pad button { padding: 8px; }
          .hint { color: #d6efe4; font-size: 13px; margin-top: 10px; }
        </style>
      </head>
      <body>
        <main>
          <h1>🐍 贪吃蛇</h1>
          <div class="hud"><div><strong id="score">0</strong>分数</div><div><strong id="best">0</strong>最佳</div></div>
          <canvas id="board" width="360" height="360" aria-label="贪吃蛇游戏区域"></canvas>
          <div class="row">
            <button id="toggle" class="btn" type="button">开始游戏</button>
            <button id="reset" class="btn" type="button">重新开始</button>
          </div>
          <div class="pad">
            <span></span>
            <button type="button" data-dir="up">▲</button>
            <span></span>
            <button type="button" data-dir="left">◀</button>
            <button type="button" data-dir="down">▼</button>
            <button type="button" data-dir="right">▶</button>
          </div>
          <div class="hint">方向键 / WASD 或触屏按钮控制；空格可暂停。</div>
        </main>
        <script>
          const canvas = document.getElementById('board');
          const ctx = canvas.getContext('2d');
          const grid = 18;
          const cell = canvas.width / grid;
          const scoreEl = document.getElementById('score');
          const bestEl = document.getElementById('best');
          const toggle = document.getElementById('toggle');
          let snake = [{ x: 8, y: 9 }, { x: 7, y: 9 }, { x: 6, y: 9 }];
          let dir = { x: 1, y: 0 };
          let nextDir = { x: 1, y: 0 };
          let food = { x: 12, y: 9 };
          let score = 0;
          let best = Number(localStorage.getItem('snakeBest') || 0);
          let timer = null;
          let paused = true;
          let over = false;

          bestEl.textContent = best;

          function randomFood() {
            let x, y;
            do {
              x = Math.floor(Math.random() * grid);
              y = Math.floor(Math.random() * grid);
            } while (snake.some(seg => seg.x === x && seg.y === y));
            food = { x, y };
          }

          function draw() {
            ctx.fillStyle = '#0f1e1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#18352d';
            for (let i = 0; i <= grid; i++) {
              ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, canvas.height); ctx.stroke();
              ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(canvas.width, i * cell); ctx.stroke();
            }

            ctx.fillStyle = '#ffbd59';
            ctx.fillRect(food.x * cell + 4, food.y * cell + 4, cell - 8, cell - 8);

            snake.forEach((seg, index) => {
              ctx.fillStyle = index === 0 ? '#a1ffd6' : '#45c997';
              ctx.fillRect(seg.x * cell + 2, seg.y * cell + 2, cell - 4, cell - 4);
            });

            if (over) {
              ctx.fillStyle = '#0009';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.textAlign = 'center';
              ctx.fillStyle = '#fff';
              ctx.font = 'bold 24px sans-serif';
              ctx.fillText('游戏结束 · ' + score + ' 分', canvas.width / 2, canvas.height / 2 - 10);
            }
          }

          function reset() {
            clearInterval(timer);
            timer = null;
            snake = [{ x: 8, y: 9 }, { x: 7, y: 9 }, { x: 6, y: 9 }];
            dir = { x: 1, y: 0 };
            nextDir = { x: 1, y: 0 };
            score = 0;
            over = false;
            paused = true;
            scoreEl.textContent = '0';
            toggle.textContent = '开始游戏';
            randomFood();
            draw();
          }

          function start() {
            if (over) reset();
            if (timer) {
              paused = !paused;
              toggle.textContent = paused ? '继续' : '暂停';
              return;
            }
            paused = false;
            toggle.textContent = '暂停';
            timer = setInterval(tick, 125);
          }

          function tick() {
            if (paused) return;
            dir = nextDir;
            const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
            const willEat = head.x === food.x && head.y === food.y;
            const body = willEat ? snake : snake.slice(0, -1);

            if (head.x < 0 || head.y < 0 || head.x >= grid || head.y >= grid || body.some(seg => seg.x === head.x && seg.y === head.y)) {
              clearInterval(timer);
              timer = null;
              over = true;
              paused = true;
              toggle.textContent = '再来一局';
              if (score > best) {
                best = score;
                localStorage.setItem('snakeBest', String(best));
                bestEl.textContent = best;
              }
              draw();
              return;
            }

            snake.unshift(head);
            if (willEat) {
              score += 10;
              scoreEl.textContent = score;
              randomFood();
            } else {
              snake.pop();
            }
            draw();
          }

          document.getElementById('toggle').addEventListener('click', start);
          document.getElementById('reset').addEventListener('click', reset);

          document.addEventListener('keydown', (event) => {
            const map = {
              ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
              ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
              w: { x: 0, y: -1 }, s: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 }
            };
            const newDir = map[event.key];
            if (newDir) {
              event.preventDefault();
              if (newDir.x !== -dir.x || newDir.y !== -dir.y) nextDir = newDir;
            } else if (event.code === 'Space') {
              event.preventDefault();
              start();
            }
          });

          document.querySelectorAll('[data-dir]').forEach((button) => {
            button.addEventListener('click', () => {
              const dirMap = {
                up: { x: 0, y: -1 },
                down: { x: 0, y: 1 },
                left: { x: -1, y: 0 },
                right: { x: 1, y: 0 }
              };
              const next = dirMap[button.dataset.dir];
              if (next.x !== -dir.x || next.y !== -dir.y) nextDir = next;
            });
          });

          reset();
        <\/script>
      </body>
      </html>`;

    const game2048 = `<!DOCTYPE html>
      <html lang="zh-CN">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
          * { box-sizing: border-box; }
          body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top,#403667,#0b1020 75%); color: white; font-family: system-ui, sans-serif; text-align: center;
          }
          main { width: min(100%, 460px); padding: 18px; }
          .top { display: flex; justify-content: space-between; align-items: center; }
          .scores { display: flex; gap: 8px; }
          .score { background: rgba(255,255,255,.12); border-radius: 8px; padding: 5px 12px; }
          .score b { display: block; font-size: 20px; }

      <body>

            <button id="undo" class="btn" type="button">↶ 撤销</button>
          </div>

        <script>
          const boardEl = document.getElementById('board');
          const scoreEl = document.getElementById('score');
          const bestEl = document.getElementById('best');
          const messageEl = document.getElementById('message');
          let board = []; 
          let score = 0;
          let best = Number(localStorage.getItem('best2048') || 0);
          let prev = null;

          function spawnRandom() {
            const empty = [];
            board.forEach((row, y) => row.forEach((cell, x) => { if (!cell) empty.push([y, x]); }));
            if (!empty.length) return;
            const [y, x] = empty[Math.floor(Math.random() * empty.length)];
            board[y][x] = Math.random() < .9 ? 2 : 4;
          }

          function render() {
            boardEl.replaceChildren();
            board.flat().forEach((value) => {
              const cell = document.createElement('div');
              cell.className = 'cell v' + Math.min(value || 0, 2048);
              cell.textContent = value || '';
              boardEl.appendChild(cell);
            });
            scoreEl.textContent = score;
            bestEl.textContent = best;
          }

          function init() {
            board = Array.from({ length: 4 }, () => [0, 0, 0, 0]);
            score = 0;
            prev = null;
            spawnRandom();
            spawnRandom();
            render();
            messageEl.textContent = '方向键 / WASD 或滑动屏幕，合并相同数字到达 2048！';
          }

          function canMove() {
            if (board.some(row => row.some(cell => cell === 0))) return true;
            for (let y = 0; y < 4; y++) {
              for (let x = 0; x < 4; x++) {
                if ((x < 3 && board[y][x] === board[y][x + 1]) || (y < 3 && board[y][x] === board[y + 1][x])) return true;
              }
            }
            return false;
          }

          function compress(line) {
            const values = line.filter(Boolean);
            const merged = [];
            for (let i = 0; i < values.length; i++) {
              if (values[i] === values[i + 1]) {
                const total = values[i] * 2;
                merged.push(total);
                score += total;
                i++;
              } else {
                merged.push(values[i]);
              }
            }
            while (merged.length < 4) merged.push(0);
            return merged;
          }

          function move(direction) {
            const before = JSON.stringify(board);
            const beforeScore = score;

            if (direction === 'left' || direction === 'right') {
              for (let y = 0; y < 4; y++) {
                let line = board[y].slice();
                if (direction === 'right') line.reverse();
                const merged = compress(line);
                line = direction === 'right' ? merged.reverse() : merged;
                board[y] = line;
              }
            } else {
              for (let x = 0; x < 4; x++) {
                let line = board.map(row => row[x]);
                if (direction === 'down') line.reverse();
                const merged = compress(line);
                line = direction === 'down' ? merged.reverse() : merged;
                for (let y = 0; y < 4; y++) board[y][x] = line[y];
              }
            }

            if (JSON.stringify(board) === before) {
              score = beforeScore;
              return;
            }

            prev = { board: JSON.parse(before), score: beforeScore };
            spawnRandom();
            if (score > best) {
              best = score;
              localStorage.setItem('best2048', String(best));
            }
            render();

            if (board.flat().includes(2048)) {
              messageEl.textContent = '🎉 2048 达成！继续挑战更高分吧。';
            } else if (!canMove()) {
              messageEl.textContent = '棋盘已满，没有可合并的方块。点击新游戏再试一次。';
            }
          }

          function undo() {
            if (!prev) return;
            board = prev.board;
            score = prev.score;
            prev = null;
            render();
            messageEl.textContent = '已撤销上一步。';
          }

          document.addEventListener('keydown', (event) => {
            const map = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ArrowUp: 'up', w: 'up', ArrowDown: 'down', s: 'down' };
            if (map[event.key]) {
              event.preventDefault();
              move(map[event.key]);
            }
          });

          let touchStart = null;
          boardEl.addEventListener('touchstart', (event) => {
            const t = event.changedTouches[0];
            touchStart = [t.clientX, t.clientY];
          }, { passive: true });

          boardEl.addEventListener('touchend', (event) => {
            if (!touchStart) return;
            const t = event.changedTouches[0];
            const dx = t.clientX - touchStart[0];
            const dy = t.clientY - touchStart[1];
            if (Math.max(Math.abs(dx), Math.abs(dy)) > 25) {
              if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
              else move(dy > 0 ? 'down' : 'up');
            }
            touchStart = null;
          }, { passive: true });

          document.getElementById('new').addEventListener('click', init);
          document.getElementById('undo').addEventListener('click', undo);
          init();
        <\/script>
      </body>
      </html>`;

              if (board[y].every(Boolean)) {
                board.splice(y, 1);
                board.unshift(Array(cols).fill(0));
                cleared += 1;
                y++;
              }
            }
            if (cleared) {
              lines += cleared;
              score += [0, 100, 300, 500, 800][cleared] * level;
              level = Math.floor(lines / 10) + 1;
              scoreEl.textContent = score;
              linesEl.textContent = lines;
              levelEl.textContent = level;
            }
          }
          function nextPiece() {
            current = randomPiece();
            if (collide(current, 0, 0)) {
              running = false;
              clearInterval(dropTimer);
              alert('游戏结束！本轮得分：' + score);
              return;
            }
            render();
          }
          function tick() {
            if (!running || !current) return;
            if (!collide(current, 0, 1)) {
              current.y += 1;
            } else {
              mergePiece();
              clearLines();
              nextPiece();
            }
            render();
          }
          function moveLeft() { if (!running || !current || collide(current, -1, 0)) return; current.x -= 1; render(); }
          function moveRight() { if (!running || !current || collide(current, 1, 0)) return; current.x += 1; render(); }
          function rotateCurrent() { if (!running || !current) return; const rotated = rotate(current.matrix); if (!collide(current, 0, 0, rotated)) current.matrix = rotated; render(); }
          function dropFast() { if (!running || !current) return; while (!collide(current, 0, 1)) current.y += 1; tick(); }
          function startGame() {
            if (running) return;
            running = true;
            board = Array.from({ length: rows }, () => Array(cols).fill(0));
            score = 0; lines = 0; level = 1; scoreEl.textContent = '0'; linesEl.textContent = '0'; levelEl.textContent = '1';
            nextPiece();
            clearInterval(dropTimer);
            dropTimer = setInterval(tick, 450 - (level - 1) * 25);
          }
          function pauseGame() {
            if (!running) return;
            running = !running;
            if (running) {
              dropTimer = setInterval(tick, 450 - (level - 1) * 25);
            } else {
              clearInterval(dropTimer);
            }
          }
          document.addEventListener('keydown', (event) => {
            if (!running && event.key !== 'Enter') return;
            if (event.key === 'ArrowLeft') moveLeft();
            if (event.key === 'ArrowRight') moveRight();
            if (event.key === 'ArrowDown') tick();
            if (event.key === 'ArrowUp') rotateCurrent();
            if (event.key === ' ') { event.preventDefault(); dropFast(); }
          });
          document.getElementById('startBtn').addEventListener('click', startGame);
          document.getElementById('pauseBtn').addEventListener('click', pauseGame);
          render();
        <\/script>
      </body>
      </html>`;

    const games = [
      { id: 'click', title: '极速点击', category: '休闲', description: '10 秒挑战手速，随时测试你的反应速度。', emoji: '⚡', color: 'linear-gradient(135deg, #6242a6, #29234b)', html: clickGame },
      { id: 'snake', title: '贪吃蛇', category: '街机', description: '方向键控制移动，吃到食物成长，避免撞到墙和自己。', emoji: '🐍', color: 'linear-gradient(135deg, #1b7a5c, #17343d)', html: snakeGame },
      { id: '2048', title: '数字 2048', category: '益智', description: '合并相同数字，追求高分与更高的 2048 目标。', emoji: '🔢', color: 'linear-gradient(135deg, #8066cc, #342c62)', html: game2048 },
      { id: 'memory', title: '记忆翻牌', category: '益智', description: '记住卡片位置，翻开全部配对，测试记忆力。', emoji: '🧠', color: 'linear-gradient(135deg, #4d6bd8, #2b274b)', html: memoryGame },
      { id: 'typing', title: '打字挑战', category: '休闲', description: '30 秒内容输入与连击奖励，越快越准越高分。', emoji: '⌨️', color: 'linear-gradient(135deg, #255b9a, #1c2248)', html: typingGame },
      { id: 'tetris', title: '俄罗斯方块', category: '动作', description: '经典休眠式消行，适合短时放松和挑战极限。', emoji: '🧩', color: 'linear-gradient(135deg, #177ea7, #234d74)', html: tetrisGame }
    ];

    const $ = (id) => document.getElementById(id);
    const grid = $('gameGrid');
    const filters = $('filters');
    const search = $('search');
    const dialog = $('gameDialog');
    const frame = $('gameFrame');
    let activeGame = null;
    let selectedCategory = '全部';

    $('year').textContent = new Date().getFullYear();

    function renderFilters() {
      const categories = ['全部', ...new Set(games.map(game => game.category))];
      if (!categories.includes(selectedCategory)) selectedCategory = '全部';
      filters.replaceChildren();
      for (const category of categories) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'filter' + (category === selectedCategory ? ' active' : '');
        button.textContent = category;
        button.setAttribute('aria-pressed', String(category === selectedCategory));
        button.addEventListener('click', () => {
          selectedCategory = category;
          renderFilters();
          renderGames();
        });
        filters.appendChild(button);
      }
    }

    function renderGames() {
      const keyword = search.value.trim().toLowerCase();
      const visible = games.filter((game) => {
        const categoryMatch = selectedCategory === '全部' || game.category === selectedCategory;
        const text = `${game.title} ${game.description} ${game.category}`.toLowerCase();
        return categoryMatch && text.includes(keyword);
      });

      $('summary').textContent = `共 ${games.length} 款游戏，当前显示 ${visible.length} 款`;
      grid.replaceChildren();

      if (!visible.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '没有找到匹配的游戏，换个关键词试试。';
        grid.appendChild(empty);
        return;
      }

      for (const game of visible) {
        const card = document.createElement('article');
        card.className = 'card';

        const cover = document.createElement('div');
        cover.className = 'cover';
        cover.style.background = game.color;
        cover.textContent = game.emoji;

        const body = document.createElement('div');
        body.className = 'card-body';

        const top = document.createElement('div');
        top.className = 'card-top';
        const title = document.createElement('h2');
        title.textContent = game.title;
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = game.category;
        top.appendChild(title);
        top.appendChild(tag);

        const description = document.createElement('p');
        description.textContent = game.description;

        const play = document.createElement('button');
        play.type = 'button';
        play.className = 'play';
        play.textContent = '▶ 一键游玩';
        play.addEventListener('click', () => openGame(game));

        body.appendChild(top);
        body.appendChild(description);
        body.appendChild(play);

        card.appendChild(cover);
        card.appendChild(body);
        grid.appendChild(card);
      }
    }

    function loadGame(game) {
      const oldFrame = $('gameFrame');
      const newFrame = oldFrame.cloneNode(false);
      newFrame.title = `${game.title} · 游戏运行区域`;
      newFrame.srcdoc = game.html;
      oldFrame.replaceWith(newFrame);
    }

    function openGame(game) {
      activeGame = game;
      $('playerTitle').textContent = game.title;
      loadGame(game);
      if (!dialog.open) dialog.showModal();
    }

    function openFirstGame() {
      const first = games[Math.floor(Math.random() * games.length)];
      openGame(first);
    }

    $('restartButton').addEventListener('click', () => {
      if (activeGame) loadGame(activeGame);
    });

    $('closeButton').addEventListener('click', () => dialog.close());
    dialog.addEventListener('close', () => {
      const currentFrame = $('gameFrame');
      currentFrame.removeAttribute('srcdoc');
      currentFrame.src = 'about:blank';
      activeGame = null;
    });

    $('fullscreenButton').addEventListener('click', async () => {
      try {
        const player = $('player');
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else if (player.requestFullscreen) {
          await player.requestFullscreen();
        }
      } catch (error) {
        console.warn('无法进入全屏：', error);
      }
    });

    search.addEventListener('input', renderGames);
    renderFilters();
    renderGames();
  </script>
</body>
</html>
